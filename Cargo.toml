[package]
name = "zapret-hub-rs"
version = "0.1.2"
edition = "2024"
authors = ["WETQV"]
build = "build.rs"
description = "Windows GUI utility for managing a local Zapret bundle"
rust-version = "1.94"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.33", default-features = true }
image = { version = "0.25", default-features = false, features = ["ico"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(windows)'.build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[package.metadata.winres]
ProductName = "Zapret Hub"
FileDescription = "Windows GUI utility for managing a local Zapret bundle"
OriginalFilename = "zapret-hub-rs.exe"
LegalCopyright = "Copyright (c) 2026 WETQV"
