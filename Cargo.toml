[package]
name = "zapret-hub-rs"
version = "0.2.0"
edition = "2024"
authors = ["WETQV"]
build = "build.rs"
description = "Windows GUI utility for managing a local Zapret bundle"
rust-version = "1.95"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.37", default-features = true }
image = { version = "0.25", default-features = false, features = ["ico"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# schannel: no C toolchain needed for the Windows cross build, uses the system cert store.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy"] }
tray-icon = { version = "0.26", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
# The app only runs on Windows; this keeps `cargo test` / UI previews building on the Linux dev host.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
winresource = { version = "0.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.winresource]
ProductName = "Zapret Hub"
FileDescription = "Windows GUI utility for managing a local Zapret bundle"
OriginalFilename = "zapret-hub-rs.exe"
LegalCopyright = "Copyright (c) 2026 WETQV"
